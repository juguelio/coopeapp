# Entorno local descartable. No monta datos/configuración de producción.
# Puerto HTTP solo en loopback; PostgreSQL no publica puertos.
name: coopeapp-pilot-test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 512m
  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: local-test-only
    volumes:
      - ../addons:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo
    ports:
      - "127.0.0.1:18069:8069"
    command:
      - odoo
      - -d
      - coop_pilot_local_test
      - --db-filter=^coop_pilot_local_test$$
      - --workers=0
      - --max-cron-threads=0
      - --without-demo=all
    mem_limit: 2g
volumes:
  odoo-data:
