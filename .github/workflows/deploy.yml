name: Deploy a VPS

# Deploy automático: cada push a main que toque addons/ sube los módulos
# cambiados al VPS y los actualiza. También se puede disparar a mano.
# Requiere los secrets cargados por scripts/setup-ci-deploy.sh:
#   VPS_SSH_PRIVATE_KEY, VPS_HOST, VPS_USER, VPS_KNOWN_HOSTS

on:
  push:
    branches: [main]
    paths: ['addons/**']
  workflow_dispatch:
    inputs:
      modulos:
        description: 'Módulos a actualizar (separados por coma). Vacío = autodetecta del último push.'
        required: false
        default: ''

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar módulos cambiados
        id: mods
        # El input va por env y NO interpolado en el script: este valor termina
        # dentro de un comando que corre por SSH en el VPS de producción, así
        # que un `${{ }}` acá es ejecución remota de comandos disfrazada de
        # nombre de módulo. Además se valida el formato antes de usarlo.
        env:
          MANUAL: ${{ github.event.inputs.modulos }}
        run: |
          set -e
          if [ -n "$MANUAL" ]; then
            case "$MANUAL" in
              *[!A-Za-z0-9_,-]*)
                echo "::error::Input inválido. Solo nombres de módulo" \
                     "separados por coma (letras, números, _ y -)."
                exit 1 ;;
            esac
            MODS="$MANUAL"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="HEAD~1"
            fi
            # OJO el pathspec: 'addons/' sin barra-asterisco-barra. Con
            # 'addons/*/' git no matchea NADA en --name-only (lista blobs, y
            # ese patrón pide una entrada que termine en /), así que la
            # detección devolvía vacío y el deploy se salteaba en silencio
            # dando verde. Pasó en los 3 pushes anteriores.
            MODS=$(git diff --name-only "$BEFORE" HEAD -- 'addons/' \
              | sed -nE 's#^addons/([^/]+)/.*#\1#p' | sort -u | paste -sd, -)
          fi
          # La validación de formato corre para los DOS caminos, no solo para
          # el input manual. Un directorio bajo addons/ puede llamarse con
          # metacaracteres, y este valor viaja a un comando remoto.
          case "$MODS" in
            *[!A-Za-z0-9_,-]*)
              echo "::error::Nombre de módulo con caracteres no permitidos:" \
                   "'$MODS'. Revisá qué directorios hay bajo addons/."
              exit 1 ;;
          esac
          echo "modulos=$MODS" >> "$GITHUB_OUTPUT"
          echo "Módulos a deployar: ${MODS:-(ninguno)}"
          # Sin módulos no hay nada que hacer, y este workflow solo se dispara
          # cuando cambió algo en addons/**: llegar acá vacío significa que la
          # detección falló. Fallar es obligatorio — un deploy que no deploya
          # pero reporta éxito es peor que uno que revienta.
          if [ -z "$MODS" ]; then
            echo "::error::No se detectó ningún módulo para deployar. La" \
                 "detección falló o el push no tocó addons/. Revisá el" \
                 "pathspec antes de dar el deploy por hecho."
            exit 1
          fi

      - name: Configurar SSH
        if: steps.mods.outputs.modulos != ''
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Subir addons + actualizar Odoo
        if: steps.mods.outputs.modulos != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          MODULOS: ${{ steps.mods.outputs.modulos }}
          # La base ya no se pasa desde acá: la fija deploy-modulos.sh en el
          # VPS. Un parámetro que el CI puede elegir es un parámetro que un CI
          # comprometido puede elegir.
        run: |
          set -e
          SSH="ssh -i $HOME/.ssh/id_ci -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Destino ABSOLUTO, sin ~: con `command=` forzado el shell remoto no
          # expande el tilde y rsync crearía un directorio llamado "~".
          DEST="/home/$VPS_USER/odoo-coop/addons/"
          for m in ${MODULOS//,/ }; do
            [ -d "addons/$m" ] || { echo "✗ addons/$m no existe, salteo"; continue; }
            find "addons/$m" -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null || true
            echo "→ Subiendo $m..."
            rsync -az --delete -e "$SSH" "addons/$m" "$VPS_USER@$VPS_HOST:$DEST"
          done
          echo "→ Actualizando módulos ($MODULOS) y reiniciando Odoo..."
          # Ya no se manda un bloque de shell: la llave de CI está acotada a
          # un comando forzado que solo acepta `deploy <lista>` y el rsync a
          # addons/. Ver docs/seguridad-vps.md. Si esto falla con "Comando no
          # permitido", el wrapper del VPS está desactualizado.
          $SSH "$VPS_USER@$VPS_HOST" "deploy $MODULOS"
          echo "✓ Deploy de $MODULOS completo → https://www.coopeapp.com.ar/app"
